<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>申论答题卡 · 可打字版</title>
<style>
  /* ==========================================================================
     pr-ui：中性灰白底座 + 1px 线 + 极淡双层影来拉层级；
     整屏只留一个彩色，且只表状态；焦点靠压深描边，不发光。
     所有选择器与原版一致，JS 依赖的 class 全部保留。
     ========================================================================== */
  :root{
    /* pr-ui 中性底座 */
    --canvas:#f4f4f5; --canvas-dot:#d4d4d8;
    --surface:#fff;
    --text:#111114; --text-2:#6b6b72; --muted:#a3a3ac;
    --line:#ececee; --line-strong:#e0e0e3; --sel:#f0f0f2;
    --accent:#a3e635; --accent-ink:#1a2e05; --danger:#d92d20;
    --glass:rgba(255,255,255,.84);
    --shadow-card:0 0 0 1px var(--line-strong), 0 2px 5px rgba(0,0,0,.14);
    --r-card:10px; --r-ctl:8px;
    --ease:cubic-bezier(.16,1,.3,1);

    /* 旧变量名映射（其余样式与内联样式沿用旧名，避免漏改） */
    --bg:var(--canvas);
    --grid:var(--line-strong);
    --fill:var(--sel);
    --warn:var(--danger);
    --accent-2:var(--text);
    --draft-w:360px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --canvas:#0b0b0d; --canvas-dot:#232327;
      --surface:#101014;
      --text:#f2f2f4; --text-2:#a0a0a8; --muted:#6b6b73;
      --line:#232327; --line-strong:#2c2c31; --sel:#1c1c20;
      --danger:#ff6b63;
      --glass:rgba(11,11,13,.76);
      --shadow-card:0 0 0 1px var(--line), 0 2px 5px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--text);
       font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;
       letter-spacing:.1px;display:flex;align-items:flex-start;min-height:100vh;
       -webkit-tap-highlight-color:transparent}
  /* 画布点阵：给"可摊开的桌面"一个触感，不参与布局 */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
               background:radial-gradient(var(--canvas-dot) 1px, transparent 1px) 0 0 / 16px 16px;
               opacity:.85}
  .wrap{position:relative;z-index:1;flex:1 1 auto;min-width:0;max-width:980px;margin:0 auto;padding:18px 18px 64px}

  /* ---------- 工具栏 ---------- */
  .bar{position:sticky;top:0;z-index:9;padding:12px 0 10px;border-bottom:1px solid var(--line);
       background:var(--glass);backdrop-filter:blur(16px) saturate(1.5);
       -webkit-backdrop-filter:blur(16px) saturate(1.5);
       display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .bar .g{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-2)}
  select,input[type=number]{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line-strong);
       border-radius:var(--r-ctl);background:var(--surface);color:var(--text);height:30px}
  select:hover,input[type=number]:hover{border-color:var(--muted)}
  select:focus-visible,input[type=number]:focus-visible{outline:none;border-color:var(--text-2)}
  button{font:inherit;font-size:12.5px;padding:5px 11px;height:30px;border:1px solid var(--line-strong);
         border-radius:var(--r-ctl);background:var(--surface);color:var(--text-2);cursor:pointer;
         transition:background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease)}
  button:hover{background:var(--sel);border-color:var(--muted);color:var(--text)}
  button:active{background:var(--sel)}
  button:focus-visible{outline:2px solid var(--text-2);outline-offset:2px}
  /* 主动作按钮：深底白字，不占用唯一彩色 */
  button.primary{background:var(--text);border-color:var(--text);color:var(--surface)}
  button.primary:hover{background:var(--text-2);border-color:var(--text-2);color:var(--surface)}
  button.danger:hover{border-color:var(--danger);color:var(--danger)}
  .switch{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);cursor:pointer;
          border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-ctl);
          padding:5px 10px;height:30px;
          transition:border-color .18s var(--ease), color .18s var(--ease)}
  .switch:hover{border-color:var(--muted)}
  .switch input{accent-color:var(--text);margin:0}
  .switch.on{border-color:var(--danger);color:var(--danger)}

  /* 工具栏里那个「历史」链接，跟按钮同一档 */
  .bar a[href]{font-size:12.5px;height:30px;display:inline-flex;align-items:center;
               padding:0 11px;border:1px solid var(--line-strong);border-radius:var(--r-ctl);
               background:var(--surface);color:var(--text-2);text-decoration:none;
               transition:background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease)}
  .bar a[href]:hover{background:var(--sel);border-color:var(--muted);color:var(--text)}

  /* ---------- 状态条 ---------- */
  .stat{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);
        font-variant-numeric:tabular-nums;margin:14px 2px 10px}
  .stat b{color:var(--text-2);font-weight:500}
  .stat .over{color:var(--danger);font-weight:500}

  /* ---------- 答题卡 ---------- */
  .paper{background:var(--surface);border-radius:var(--r-card);padding:14px;overflow-x:auto;
         box-shadow:var(--shadow-card);animation:prIn .5s var(--ease) both}
  table.sheet{border-collapse:collapse;margin:0 auto;font-family:"Kaiti SC","STKaiti","Songti SC",serif}
  table.sheet td.no{width:26px;border:none;color:var(--muted);font-size:10.5px;text-align:right;
                    padding-right:7px;font-family:-apple-system,sans-serif;user-select:none;
                    font-variant-numeric:tabular-nums}
  table.sheet td{border:1px solid var(--grid);width:26px;height:28px;text-align:center;line-height:28px;
                 font-size:16px;color:var(--text);padding:0}
  /* 当前格：把描边压深一格 + 极浅的按下底，不用发光 */
  table.sheet td.cur{background:var(--sel);box-shadow:inset 0 0 0 2px var(--text-2)}
  table.sheet td.pad{background:var(--surface)}       /* 空白格与内容格同底色 */
  table.sheet td{cursor:text}                         /* 整格可点 */
  table.sheet tr.over td{background:rgba(217,45,32,.045);color:var(--danger)}
  table.sheet tr.over td.no{color:var(--danger);background:transparent}
  table.sheet td.title{font-weight:600}
  .hint{color:var(--muted);font-size:11px;line-height:1.9;margin-top:14px}
  kbd{background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;
      padding:0 5px;font-size:10.5px;font-family:inherit;color:var(--text-2)}

  /* ---------- 题目 ---------- */
  .qbox{background:var(--surface);border-radius:var(--r-card);margin:12px 0 0;overflow:hidden;
        box-shadow:var(--shadow-card);animation:prIn .5s var(--ease) both}
  .qbox summary{cursor:pointer;padding:11px 15px;font-size:12.5px;color:var(--text-2);
                list-style:none;user-select:none;
                transition:background .18s var(--ease)}
  .qbox summary:hover{background:var(--sel)}
  .qbox summary::-webkit-details-marker{display:none}
  .qbox summary::before{content:"▸ ";color:var(--muted)}
  .qbox[open] summary::before{content:"▾ "}
  .qbox[open] summary{border-bottom:1px solid var(--line)}
  .qtitle{color:var(--text);font-weight:500}
  .qbody{padding:16px 18px;font-size:13.5px;line-height:1.95;color:var(--text-2);
         white-space:pre-wrap;max-height:46vh;overflow:auto}
  .qbody b{color:var(--text);font-weight:600}

  /* ---------- 材料标注（内容用色，不属于装饰） ---------- */
  .qbody{position:relative}
  .qbody mark{padding:0;border-radius:2px;color:inherit;background:transparent}
  .qbody mark.y{background:#fdf0a8;color:#111114}
  .qbody mark.g{background:#cdeccd;color:#111114}
  .qbody mark.b{background:#cfe4f7;color:#111114}
  .qbody u.mk{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;
              text-decoration-color:var(--danger)}
  .qbody s.mk{text-decoration-thickness:2px;text-decoration-color:var(--muted)}
  .markbar{position:fixed;z-index:50;display:none;background:var(--surface);border-radius:var(--r-card);
           padding:4px;box-shadow:var(--shadow-card), 0 6px 20px rgba(0,0,0,.10);
           gap:2px;align-items:center}
  .markbar.show{display:flex}
  .markbar button{background:transparent;border:none;height:auto;color:var(--text-2);font-size:12px;
                  padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .markbar button:hover{background:var(--sel);color:var(--text)}
  .markbar .sw{width:16px;height:16px;border-radius:4px;border:1px solid var(--line-strong);padding:0}
  .markbar .sep{width:1px;height:16px;background:var(--line);margin:0 3px}

  .build{font-size:10.5px;color:var(--muted);margin-left:8px}
  /* 半角数字/字母/标点太窄，撑到接近格宽，避免两侧留白被误看成空格子 */
  table.sheet td .hw{display:inline-block;width:100%;text-align:center;
                     transform:scaleX(1.5);transform-origin:center center}
  table.sheet td .num{display:inline-block;letter-spacing:-.5px;white-space:nowrap;
                      font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}

  /* 同步状态：彩色只用在那个点上，文字仍是中性色 */
  .sync{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .sync.ok{color:var(--text-2)}
  .sync.ok::before{content:"";display:inline-block;width:5px;height:5px;border-radius:999px;
                   background:var(--accent);margin-right:5px;vertical-align:middle}
  .sync.err{color:var(--danger)}
  .ro-tip{display:none;background:var(--surface);border-radius:var(--r-ctl);padding:9px 13px;
          font-size:12px;color:var(--text-2);margin:12px 0 0;box-shadow:var(--shadow-card);
          border-left:2px solid var(--accent)}
  .ro-tip.show{display:block}

  /* 隐藏输入框 */
  #sink{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}

  /* 锁定横幅 */
  .lockbar{display:none;background:var(--surface);border-radius:var(--r-ctl);padding:9px 13px;
           font-size:12px;color:var(--text-2);margin:12px 0 0;box-shadow:var(--shadow-card);
           border-left:2px solid var(--danger)}
  .lockbar.show{display:block}

  /* 草稿纸：右侧分栏（不是浮层）——打开时挤压主内容，与正文并排各占一块 */
  .draft-panel{flex:0 0 auto;width:0;overflow:hidden;background:var(--surface);
               pointer-events:none;transition:width .24s var(--ease)}
  .draft-panel.open{width:var(--draft-w);pointer-events:auto}
  .draft-inner{width:var(--draft-w);height:100vh;display:flex;flex-direction:column;
               border-left:1px solid var(--line)}
  .draft-head{display:flex;align-items:center;gap:8px;padding:13px 15px;
              border-bottom:1px solid var(--line);flex:0 0 auto}
  .draft-head b{font-size:13px;font-weight:500}
  .draft-head .tip{font-size:11px;color:var(--muted);margin-right:auto;line-height:1.4}
  .draft-area{flex:1;border:0;outline:0;resize:none;padding:15px 16px;
              font-family:inherit;font-size:13.5px;line-height:1.9;color:var(--text);background:transparent}
  .draft-area::placeholder{color:var(--muted)}
  .draft-foot{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:11px 15px;
              border-top:1px solid var(--line);font-size:11px;color:var(--muted);
              font-variant-numeric:tabular-nums}
  .draft-foot .r{margin-left:auto}
  @media (max-width:820px){ :root{--draft-w:84vw} }

  @keyframes prIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){
    *, *::before{animation-duration:.01ms !important; transition-duration:.01ms !important}
  }

  @media print{
    .bar,.stat,.hint,.lockbar,.draft-panel{display:none!important}
    body{background:#fff;display:block}
    body::before{display:none}
    .wrap{max-width:none;padding:0}
    .paper{border:none;padding:0;box-shadow:none}
    table.sheet td{border-color:#999}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="g">
      <label for="target">字数</label>
      <select id="target">
        <option value="150">150 字 · 概括</option>
        <option value="200">200 字 · 分析</option>
        <option value="250">250 字 · 概括/公文</option>
        <option value="300">300 字 · 分析/公文</option>
        <option value="350" selected>350 字 · 公文</option>
        <option value="400">400 字 · 对策</option>
        <option value="450">450 字 · 对策</option>
        <option value="500">500 字 · 公文/对策</option>
        <option value="600">600 字 · 公文</option>
        <option value="800">800 字 · 作文（下限）</option>
        <option value="1000">1000 字 · 作文</option>
        <option value="1200">1200 字 · 作文（上限）</option>
        <option value="custom">自定义…</option>
      </select>
      <input type="number" id="customNum" min="50" max="2000" step="10" placeholder="字数" style="display:none;width:78px">
    </div>
    <div class="g">
      <label for="cols">每行</label>
      <select id="cols">
        <option value="20">20 格</option>
        <option value="25" selected>25 格</option>
        <option value="30">30 格</option>
      </select>
    </div>
    <label class="switch" id="lockWrap"><input type="checkbox" id="lock"> 不可删改</label>
    <label class="switch" id="mergeWrap" title="连续数字并成一格；想分开就在中间打个空格"><input type="checkbox" id="merge"> 数字合并</label>
    <button id="timeBtn">计时 30:00</button>
    <button id="reloadBtn" title="从服务器重新拉取题目与内容">↻ 刷新题目</button>
    <button id="centerBtn" title="把第一行内容居中（用于标题）">标题居中</button>
    <button id="indentBtn" title="在当前行首插入两个全角空格">空两格</button>
    <button id="newlineBtn">新段落</button>
    <button id="clearMarks">清除标记</button>
    <button id="exportBtn">复制答案</button>
    <button id="draftBtn" title="打开草稿纸（列要点、数动作）">草稿纸</button>
    <a href="/sheet/list.html" style="font-size:13px;padding:6px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);text-decoration:none">历史</a>
    <button id="clearBtn" class="danger">清空</button>
  </div>

  <div class="ro-tip" id="rotip">只读模式：这份内容由出题方写入，你可以看但不能改。去掉网址里的 <code>ro=1</code> 即可编辑。</div>
  <details class="qbox" id="qbox" open>
    <summary>今日题目　<span id="qtitle" class="qtitle">未设置</span></summary>
    <div class="qbody" id="qbody">（暂无题目。出题后这里会显示材料与作答要求。）</div>
  </details>

  <div class="lockbar" id="lockbar">🔒 不可删改已开启：退格和删除无效，写错的字也会留在格子里——这就是考场。</div>

  <div class="stat">
    <span>占格 <b id="used">0</b> / <b id="limit">350</b></span>
    <span>行数 <b id="rows">14</b></span>
    <span id="leftWrap">剩余 <b id="left">350</b></span>
    <span id="timeLeft"></span>
    <span id="sync" class="sync"></span>
    <span class="build">构建 11-04 12:25</span>
  </div>

  <div class="paper" id="paper"></div>

  <div class="markbar" id="markbar">
    <button class="sw" data-mark="y" title="黄色高亮" style="background:#fdf0a8"></button>
    <button class="sw" data-mark="g" title="绿色高亮" style="background:#cdeccd"></button>
    <button class="sw" data-mark="b" title="蓝色高亮" style="background:#cfe4f7"></button>
    <span class="sep"></span>
    <button data-mark="u">下划线</button>
    <button data-mark="s">删除线</button>
    <span class="sep"></span>
    <button data-mark="clear">取消标记</button>
  </div>

  <div class="hint">
    <kbd>回车</kbd> 新段落（自动空两格）　<kbd>退格</kbd> 删一个字（锁定后无效）　直接点格子就能继续写<br>
    标题写在第一行，写完按「标题居中」；正文每段按「新段落」会自动缩两格。<br>
    内容存在本机浏览器里，关掉页面不会丢。
  </div>

  <textarea id="sink" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
</div>

<aside class="draft-panel" id="draftPanel" aria-hidden="true">
  <div class="draft-inner">
    <div class="draft-head">
      <b>草稿纸</b>
      <span class="tip">按题目分开存，只在本机</span>
      <button id="draftClear" class="danger">清空</button>
      <button id="draftClose">收起</button>
    </div>
    <textarea class="draft-area" id="draftArea" autocomplete="off" spellcheck="false"
      placeholder="在这里列要点、数动作、试写句子……&#10;&#10;例：&#10;材料二 动词：分三类 / 建中转站 / 堆肥房就地处理&#10;材料二 动词：配专职保洁员 / 财政补助&#10;材料三 动词：发桶 / 红黑榜&#10;材料四 动词：培训 / 手册 / 村规民约&#10;干扰：材料一全则、材料四成效句"></textarea>
    <div class="draft-foot">
      <span id="draftCount">0 字</span>
      <span class="r">Esc 或点「收起」合上</span>
    </div>
  </div>
</aside>

<script>
const QS = new URLSearchParams(location.search);
// 文档 ID。本地草稿、字数设置都必须按文档隔离：否则换一道题时，
// 上一题的本地草稿会被当成"本机较新"塞进新题（公文答案跑到概括题里）。
const SHEET_ID = (QS.get('id') || 'main').slice(0, 64) || 'main';
// 文档级 key 走 LS()，全局设置（每行格数、数字合并）直接用原 key
const LS = (k) => 'shenlun_sheet:' + SHEET_ID + ':' + k;

let COLS = parseInt(localStorage.getItem('shenlun_sheet_cols') || '25', 10);
const $ = (id) => document.getElementById(id);
const paper = $('paper'), sink = $('sink');

// 旧版本草稿用的是不带文档 ID 的全局 key，把它迁到新 key（只对默认文档 main 有效）。
// 不迁移的话，main 上还没来得及保存的草稿会在升级后丢失。
if (SHEET_ID === 'main' && !localStorage.getItem(LS('text')) && localStorage.getItem('shenlun_sheet_text')) {
  localStorage.setItem(LS('text'), localStorage.getItem('shenlun_sheet_text'));
}
let text = localStorage.getItem(LS('text')) || '';
let caret = text.length;          // 光标：字符下标（不是格子下标）
let pendingCell = null;           // 点了空白格：等真正输入时才补空格
let locked = false;
// 数字合并：连续数字算一格（"13" 一格），中间加空格则分开（"1 3" 三格）
let mergeDigits = localStorage.getItem('shenlun_sheet_merge') !== '0';
let composing = false;
let timer = null, timeLeft = 30 * 60, timerRunning = false;

/* ---------------- 渲染 ---------------- */
function linesOf(t) {
  return t.split('\n');
}
/* 把一行切成「格子」，同时记录每个格子对应的字符区间 [s, e) */
function tokenizeLine(line, base) {
  const chars = [...line];
  const out = [];
  if (!mergeDigits) {
    chars.forEach((ch, i) => out.push({ t: ch, s: base + i, e: base + i + 1 }));
    return out;
  }
  let i = 0;
  while (i < chars.length) {
    // 半角空格＝换格键：结束当前格，自己不吃格子
    // 全角空格（U+3000）照旧占一格，用来做缩进
    if (chars[i] === ' ') { i += 1; continue; }
    if (/[0-9]/.test(chars[i])) {
      let j = i + 1;
      while (j < chars.length) {
        if (/[0-9]/.test(chars[j])) { j += 1; continue; }
        if (chars[j] === '.' && /[0-9]/.test(chars[j + 1] || '')) { j += 2; continue; }
        break;
      }
      out.push({ t: chars.slice(i, j).join(''), s: base + i, e: base + j });
      i = j;
    } else {
      out.push({ t: chars[i], s: base + i, e: base + i + 1 });
      i += 1;
    }
  }
  return out;
}

/* 整页布局：rows[r][c] = {t,s,e}；starts[r] = 该行起始字符位置（空行也能定位） */
function computeLayout(t) {
  const rows = [], starts = [];
  let base = 0;
  const allLines = String(t).split('\n');
  allLines.forEach((line, li) => {
    const toks = tokenizeLine(line, base);
    if (!toks.length) { rows.push([]); starts.push(base + line.length); }
    for (let i = 0; i < toks.length; i += COLS) {
      rows.push(toks.slice(i, i + COLS));
      starts.push(toks[i].s);
    }
    // 满 25 格才补空行，而且只在最后一行补：中间行补了会在段落间留下一条假空行
    if (toks.length && toks.length % COLS === 0 && li === allLines.length - 1) {
      rows.push([]); starts.push(base + line.length);
    }
    base += line.length + 1;
  });
  if (!rows.length) { rows.push([]); starts.push(0); }
  return { rows, starts };
}

function layoutRows() { return computeLayout(text).rows.length; }

function usedCells() {
  const { rows } = computeLayout(text);
  return rows.reduce((n, r) => n + r.length, 0);
}

/* 光标 → 落在第几行第几列（col 可能等于 COLS，表示要折到下一行） */
function caretCell(rows, pos) {
  for (let r = 0; r < rows.length; r += 1) {
    for (let c = 0; c < rows[r].length; c += 1) {
      const tk = rows[r][c];
      if (pos <= tk.s) return { row: r, col: c };
      if (pos < tk.e) return { row: r, col: c };
    }
  }
  const last = Math.max(0, rows.length - 1);
  return { row: last, col: (rows[last] || []).length };
}

function caretTokenPos(rows, pos) {
  let idx = 0;
  for (let r = 0; r < rows.length; r += 1) {
    for (let c = 0; c < rows[r].length; c += 1) {
      const tk = rows[r][c];
      if (pos <= tk.s) return { row: r, col: c, idx };
      if (pos < tk.e) return { row: r, col: c, idx };
      idx += 1;
    }
  }
  const last = Math.max(0, rows.length - 1);
  return { row: last, col: (rows[last] || []).length, idx };
}

/* 任意格子定位：先算出落点与需要补的空白格，不立刻改文本 */
function planCell(r, c) {
  const lines = linesOf(text);
  let rowBase = 0, lineStart = 0;
  for (let li = 0; li < lines.length; li += 1) {
    const toks = tokenizeLine(lines[li], lineStart);
    // 与 computeLayout 完全一致：满 25 格时「仅最后一行」会多出一个空行
    const lastLine = li === lines.length - 1;
    const rowsThisLine = Math.max(1, Math.ceil(toks.length / COLS))
      + ((toks.length && toks.length % COLS === 0 && lastLine) ? 1 : 0);
    if (r < rowBase + rowsThisLine) {
      const idx = (r - rowBase) * COLS + c;
      if (idx < toks.length) return { pos: toks[idx].s, pad: 0, extraRows: 0 };
      const lineEnd = lineStart + lines[li].length;
      return { pos: lineEnd, pad: Math.max(0, idx - toks.length), extraRows: 0 };
    }
    rowBase += rowsThisLine;
    lineStart += lines[li].length + 1;
  }
  return { pos: text.length, pad: c, extraRows: r - rowBase + 1 };
}

function applyPlan(pl) {
  let pos = pl.pos;
  if (pl.extraRows) { text += '\n'.repeat(pl.extraRows); pos += pl.extraRows; }
  if (pl.pad) {
    const pad = '\u3000'.repeat(pl.pad);
    // 关键：空白格要补在光标这一行的末尾，不是补到全文末尾
    text = text.slice(0, pos) + pad + text.slice(pos);
    pos += pad.length;
  }
  return pos;
}

/* 点到内容下面很远时，吸附到内容下方第一行，避免凭空补出多行 */
function clampRow(r) {
  const { rows } = computeLayout(text);
  return Math.min(r, rows.length);
}

/* 当前光标所在格（可能是还没写字的空白格） */
function currentCell() {
  if (pendingCell) return { r: pendingCell.r, c: pendingCell.c };
  const { rows } = computeLayout(text);
  let prev = null;
  for (let r = 0; r < rows.length; r += 1) {
    for (let c = 0; c < rows[r].length; c += 1) {
      const tk = rows[r][c];
      if (caret === tk.s) return { r, c };                 // 正好在这一格起点
      if (caret > tk.s && caret < tk.e) return { r, c };   // 在这一格内部（合并数字）
      if (tk.e <= caret) prev = { r, c };
    }
  }
  // 走到行尾/全文尾：算作「上一个字的后一格」，不再跳到下一行开头
  if (prev) {
    let r = prev.r, c = prev.c + 1;
    if (c >= COLS) { r += 1; c = 0; }
    return { r, c };
  }
  return { r: 0, c: 0 };
}

/* 跳到指定格子：有内容就落在字前，空白格挂起 pendingCell */
function gotoCell(r, c) {
  if (r < 0 || c < 0) return;
  if (c >= COLS) { r += 1; c = 0; }
  const { rows } = computeLayout(text);
  r = clampRow(r);
  if (c >= COLS) { r += 1; c = 0; }
  const row = rows[r];
  if (row && row[c]) { caret = row[c].s; pendingCell = null; }
  else {
    const pl = planCell(r, c);
    caret = pl.pos;
    pendingCell = (pl.pad || pl.extraRows) ? { r, c } : null;
  }
  render();
}

/* 上下左右按「格」走；Shift+左右退化成按字符（用于改数字里的某一位） */
function moveCaret(key, byChar) {
  if (byChar) {
    pendingCell = null;
    if (key === 'ArrowLeft') caret = Math.max(0, caret - 1);
    else if (key === 'ArrowRight') caret = Math.min(text.length, caret + 1);
    render(); focusSink();
    return;
  }
  const cur = currentCell();
  let r = cur.r, c = cur.c;
  if (key === 'ArrowLeft') {
    c -= 1;
    if (c < 0) { r -= 1; c = COLS - 1; }
  } else if (key === 'ArrowRight') {
    c += 1;
    if (c >= COLS) { r += 1; c = 0; }
  } else if (key === 'ArrowUp') {
    r -= 1;
  } else if (key === 'ArrowDown') {
    r += 1;
  } else if (key === 'Home') {
    c = 0;
  } else if (key === 'End') {
    const { rows } = computeLayout(text);
    const row = rows[r] || [];
    if (row.length) { caret = row[row.length - 1].e; pendingCell = null; render(); focusSink(); return; }
    c = 0;
  }
  gotoCell(r, c);
  focusSink();
}

function targetCells() {
  const v = $('target').value;
  if (v === 'custom') return Math.max(50, parseInt($('customNum').value || '350', 10));
  return parseInt(v, 10);
}
// 真实考场每行 25 格，命题人按「限定字数 ÷ 25」给行数，没有富余。
// 这里不加余量，写满就是满，超出的行标红——练习时能建立真实字数体感。
function minRows() { return Math.max(1, Math.ceil(targetCells() / COLS)); }

function render() {
  if (caret > text.length) caret = text.length;
  if (caret < 0) caret = 0;
  const { rows } = computeLayout(text);
  const target = targetCells();
  const targetRow = Math.ceil(target / COLS);
  const total = Math.max(rows.length + 1, minRows());
  // 光标位置：跟着 caret 走；点在空白格时用 pendingCell
  const cur = currentCell();
  let cursorRow = cur.r, cursorCol = cur.c;
  if (cursorCol >= COLS) { cursorRow += 1; cursorCol = 0; }

  let html = '<table class="sheet"><tbody>';
  for (let r = 0; r < total; r++) {
    const row = rows[r] || [];
    html += `<tr class="${r >= targetRow ? 'over' : ''}"><td class="no">${r + 1}</td>`;
    for (let c = 0; c < COLS; c++) {
      const tk = row[c];
      const ch = tk ? tk.t : '';
      let cls = '';
      if (!ch) cls = 'pad';
      if (r === cursorRow && c === cursorCol) cls = 'cur';
      if (r === 0 && ch) cls += ' title';
      const show = ch === ' ' ? '' : (ch || '');
      const len = [...show].length;
      const isNum = show && len > 1;                       // 合并后的数字
      const isHalf = show && !isNum && /[\x21-\x7e]/.test(show);
      let cell;
      if (isNum) cell = '<span class="num" style="font-size:' + (len >= 5 ? 10 : len >= 4 ? 11 : 13) + 'px">' + show + '</span>';
      else if (isHalf) cell = '<span class="hw">' + show + '</span>';
      else cell = show;
      html += `<td class="${cls}" data-r="${r}" data-c="${c}">${cell}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  paper.innerHTML = html;

  const used = usedCells();
  $('used').textContent = used;
  $('limit').textContent = target;
  $('rows').textContent = rows.length;
  const left = target - used;
  $('left').textContent = left >= 0 ? left : Math.abs(left);
  $('leftWrap').className = left < 0 ? 'over' : '';
  $('leftWrap').firstChild.textContent = left >= 0 ? '剩余 ' : '超出 ';
  localStorage.setItem(LS('text'), text);
  localStorage.setItem(LS('target'), $('target').value);
  if ($('target').value === 'custom') localStorage.setItem(LS('custom'), $('customNum').value || '');
  if (typeof scheduleSave === 'function') scheduleSave();
}

/* ---------------- 输入（按光标位置插入） ---------------- */
function append(str) {
  if (!str) return;
  if (locked) return;
  if (pendingCell) {                    // 真开始输入了，才把落点前的空白格补出来
    caret = applyPlan(planCell(pendingCell.r, pendingCell.c));
    pendingCell = null;
  }
  // 换行统一处理：段首自动空两格
  const parts = String(str).split('\n');
  let ins = '';
  parts.forEach((p, i) => {
    if (i > 0) ins += '\n　　';
    ins += p;
  });
  text = text.slice(0, caret) + ins + text.slice(caret);
  caret += ins.length;
  render();
}

function backspace() {
  if (locked) return;
  pendingCell = null;
  if (caret <= 0) return;
  // 光标前只有空白（缩进或补齐的空格）：一次清掉这一整段空白
  const ls = text.lastIndexOf('\n', caret - 1) + 1;
  if (caret > ls && /^[\s\u3000]+$/.test(text.slice(ls, caret))) {
    text = text.slice(0, ls) + text.slice(caret);
    caret = ls;
    render();
    return;
  }
  text = text.slice(0, caret - 1) + text.slice(caret);
  caret -= 1;
  // 删完若末尾只剩「只有空白的空行」，一并收掉，不用再按第二下删那个空行
  if (caret >= text.length - 1) {
    const trimmed = text.replace(/\n[\s\u3000]*$/, '');
    if (trimmed !== text) { text = trimmed; caret = Math.min(caret, text.length); }
  }
  render();
}

function delForward() {
  if (locked) return;
  if (caret >= text.length) return;
  text = text.slice(0, caret) + text.slice(caret + 1);
  render();
}

function focusSink() { sink.focus({ preventScroll: true }); }

/* 输入法常常在「单个数字/字母」提交时自动补一个半角空格，
   答题卡里这种空格会变成空格子，必须去掉；全角空格（缩进）保留 */
function cleanIme(str) {
  let t = String(str || '');
  if (!t) return '';
  const prevAlnum = /[0-9A-Za-z]$/.test(text);
  // 开头若是半角空格，且上一个字是数字/字母，判定为输入法补的，丢掉
  t = t.replace(/^[ \u00a0]+/, (m) => (prevAlnum ? '' : m));
  // 结尾的半角空格一律丢掉（下一个字会紧接上来）
  t = t.replace(/[ \u00a0]+$/, '');
  return t;
}

let compBase = '';
sink.addEventListener('blur', () => { composing = false; });

sink.addEventListener('compositionstart', () => {
  composing = true;
  compBase = sink.value;
});
sink.addEventListener('compositionend', (e) => {
  composing = false;
  // 有的输入法把结果写进 textarea 而不是 e.data，两边都兜住
  let s = e.data;
  if (!s) s = sink.value.slice(compBase.length);
  sink.value = '';
  compBase = '';
  append(cleanIme(s));
  focusSink();
});
sink.addEventListener('input', (e) => {
  // 组合还没结束（拼音在屏幕上），一律不接收：
  // 有些输入法在拼音中按退格只发普通 input，不标 isComposing，
  // 收下来就会把拼音字母写进格子
  if (composing || e.isComposing === true) return;
  composing = false;
  const v = sink.value;
  if (!v) return;
  // 普通按键原样接收；只有「单个字母数字 + 尾随半角空格」这种输入法产物才削掉空格。
  // 手动敲的空格是单独一次 input，不会命中这条，缩进不受影响。
  append(/^[0-9A-Za-z][ \u00a0]$/.test(v) ? v.slice(0, -1) : v);
  sink.value = '';
});
sink.addEventListener('keydown', (e) => {
  // 输入法正在组合（拼音未上屏）时，退格/回车/方向键都是给输入法用的，
  // 拦下来就会变成「打拼音按退格，格子里的字被删掉」
  if (e.isComposing || composing || e.keyCode === 229) return;
  if (e.key === 'Enter') {
    e.preventDefault();
    append('\n');
    return;
  }
  if (e.key === 'Backspace') { e.preventDefault(); backspace(); return; }
  if (e.key === 'Delete') { e.preventDefault(); delForward(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp'
      || e.key === 'ArrowDown' || e.key === 'Home' || e.key === 'End') {
    e.preventDefault();
    moveCaret(e.key, e.shiftKey);
    return;
  }
  // 只拦「数字、空格、数字后面的 . % ,」——输入法会把单个数字提交成「8 + 半角空格」或直接吞掉。
  // 字母一律不拦：拼音的第一个字母（如 yue 的 y）拦下来就会变成「y月」。
  if (e.isComposing || composing || e.keyCode === 229) return;   // 229 = 输入法正在处理
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  const prev = text.slice(0, caret).slice(-1);
  const prevDigit = /[0-9]/.test(prev);
  const takeIt = /^[0-9]$/.test(k)              // 数字
    || k === ' '                                 // 空格（换格键）
    || (/^[.,:%]$/.test(k) && prevDigit);        // 数字后的小数点/百分号/千分位
  if (takeIt) {
    e.preventDefault();
    append(k);
    return;
  }
});
sink.addEventListener('paste', (e) => {
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData('text') || '';
  append(t.replace(/\r/g, '').replace(/[ \t]+/g, ''));
});

paper.addEventListener('click', (e) => {
  const td = e.target.closest('td');
  if (td && td.dataset && td.dataset.r !== undefined) {
    const c = +td.dataset.c;
    const r = clampRow(+td.dataset.r);
    const pl = planCell(r, c);
    caret = pl.pos;
    // 落在空白格上：先只把光标放过去，等输入时再补全角空格
    pendingCell = (pl.pad || pl.extraRows) ? { r, c } : null;
    render();
  }
  focusSink();
});
document.addEventListener('click', (e) => {
  // 题目材料区、题目面板、标记工具条：不要抢焦点
  // 抢焦会把 DOM 选区折叠，用户刚拖出来的高亮瞬间消失
  // 草稿纸是独立输入框，抢焦点会导致在草稿纸里打不了字
  if (e.target.closest('#qbody, .qbox, #markbar, #draftPanel, #draftBtn')) return;
  if (e.target.closest('button,select,input,label,a,summary,textarea')) return;
  focusSink();
});

/* ---------------- 草稿纸侧边栏 ---------------- */
const draftPanel = $('draftPanel'), draftArea = $('draftArea');
const DRAFT_KEY = () => LS('draft');                 // 按题目隔离，换题不串
const draftCount = () => { $('draftCount').textContent = draftArea.value.length + ' 字'; };

function openDraft() {
  draftPanel.classList.add('open');
  draftPanel.setAttribute('aria-hidden', 'false');
  localStorage.setItem(LS('draft_open'), '1');
  setTimeout(() => { try { draftArea.focus({ preventScroll: true }); } catch (e) {} }, 260);
}
function closeDraft() {
  draftPanel.classList.remove('open');
  draftPanel.setAttribute('aria-hidden', 'true');
  localStorage.setItem(LS('draft_open'), '0');
  focusSink();                                       // 收起后把焦点还给答题卡
}
$('draftBtn').addEventListener('click', () => {
  if (draftPanel.classList.contains('open')) closeDraft(); else openDraft();
});
$('draftClose').addEventListener('click', closeDraft);
draftArea.addEventListener('input', () => {
  localStorage.setItem(DRAFT_KEY(), draftArea.value);
  draftCount();
});
$('draftClear').addEventListener('click', () => {
  if (!draftArea.value) return;
  if (!window.confirm('清空这张草稿纸？清空后无法恢复。')) return;
  draftArea.value = '';
  localStorage.setItem(DRAFT_KEY(), '');
  draftCount();
  draftArea.focus({ preventScroll: true });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && draftPanel.classList.contains('open')) closeDraft();
});

/* ---------------- 工具栏 ---------------- */
$('lock').addEventListener('change', (e) => {
  locked = e.target.checked;
  $('lockWrap').classList.toggle('on', locked);
  $('lockbar').classList.toggle('show', locked);
  focusSink();
});

$('merge').addEventListener('change', (e) => {
  mergeDigits = e.target.checked;
  localStorage.setItem('shenlun_sheet_merge', mergeDigits ? '1' : '0');
  render();
  focusSink();
});

$('target').addEventListener('change', () => {
  const custom = $('target').value === 'custom';
  $('customNum').style.display = custom ? 'inline-block' : 'none';
  if (custom && !$('customNum').value) $('customNum').value = 350;
  render();
});
$('customNum').addEventListener('input', render);
$('cols').addEventListener('change', () => {
  COLS = parseInt($('cols').value, 10) || 25;
  localStorage.setItem('shenlun_sheet_cols', String(COLS));
  render();
});

$('newlineBtn').addEventListener('click', () => { append('\n'); focusSink(); });

$('indentBtn').addEventListener('click', () => {
  const ls = text.lastIndexOf('\n', caret - 1) + 1;   // 当前行行首
  text = text.slice(0, ls) + '　　' + text.slice(ls);
  caret += 2;
  render(); focusSink();
});

$('reloadBtn').addEventListener('click', async () => {
  setSync('重新加载中…');
  const ok = await loadRemote();
  if (!ok) setSync(REMOTE ? '云端没有题目' : '本地模式', 'err');
});

$('centerBtn').addEventListener('click', () => {
  const lines = linesOf(text);
  if (!lines.length || !lines[0].trim()) { alert('第一行为空，先写标题'); return; }
  const t = lines[0].replace(/^[　\s]+|[　\s]+$/g, '');
  const pad = Math.max(0, Math.floor((COLS - [...t].length) / 2));
  lines[0] = '　'.repeat(pad) + t;
  text = lines.join('\n');
  caret = text.length;
  render();
});

$('clearBtn').addEventListener('click', () => {
  if (locked) { alert('不可删改已开启，先关掉开关再清空'); return; }
  if (!confirm('清空全部内容？')) return;
  text = ''; render(); focusSink();
});

$('exportBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(text);
    $('exportBtn').textContent = '已复制 ✓';
    setTimeout(() => { $('exportBtn').textContent = '复制答案'; }, 1500);
  } catch (err) {
    alert('复制失败，请手动选中格子里的文字');
  }
});

/* ---------------- 计时 ---------------- */
function fmt(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}
$('timeBtn').addEventListener('click', () => {
  if (timerRunning) {
    clearInterval(timer); timerRunning = false;
    $('timeBtn').textContent = '继续 ' + fmt(timeLeft);
    return;
  }
  timerRunning = true;
  $('timeBtn').textContent = '暂停';
  timer = setInterval(() => {
    timeLeft -= 1;
    $('timeLeft').textContent = '⏱ ' + fmt(timeLeft);
    if (timeLeft <= 0) {
      clearInterval(timer); timerRunning = false;
      $('timeBtn').textContent = '重新计时';
      $('timeLeft').textContent = '⏱ 时间到';
      timeLeft = 30 * 60;
    }
  }, 1000);
});

/* ---------------- 远程接口 ---------------- */
const READONLY = QS.get('ro') === '1';
const REMOTE = /^https?:$/.test(location.protocol);
let dirty = false, saveTimer = null, loading = false, booted = false;
// 本机最后一次真实编辑的时间戳（毫秒）。用于判断本地草稿和云端谁更新，防止刷新被旧数据覆盖。
let localAt = parseInt(localStorage.getItem(LS('local_at')) || '0', 10) || 0;

function setSync(txt, cls) {
  const el = $('sync');
  el.textContent = txt;
  el.className = 'sync' + (cls ? ' ' + cls : '');
}

async function loadRemote() {
  if (!REMOTE) { setSync('本地模式'); return false; }
  try {
    const r = await fetch('/api/sheet?id=' + encodeURIComponent(SHEET_ID), { cache: 'no-store' });
    const d = await r.json();
    if (d && d.ok && typeof d.text === 'string') {
      let hadMeta = false;
      if (d.meta && (d.meta.title || d.meta.question)) { applyMeta(d.meta); hadMeta = true; }  // 题目/标题先落地
      // 新文档正文为空时不会走下面的文本分支，这里补一次重绘，
      // 否则 meta.target 改了字数，格子行数还停在默认值。
      if (hadMeta) render();
      if (d.text && d.text !== text) {
        // 冲突保护：本机草稿比云端新（或无法判定先后）时，保留本机内容并反向上传，
        // 避免网络恢复后刷新页面，把已经打好的正文替换成服务器上的旧版本。
        const remoteAt = (d.updatedAt || 0) * 1000;
        const localText = localStorage.getItem(LS('text')) || '';
        const localNewer = localText && localText !== d.text &&
          (localAt === 0 || localAt > remoteAt + 3000);
        if (localNewer) {
          loading = true;
          text = localText;
          caret = text.length;
          if (d.meta) applyMeta(d.meta);
          render();
          loading = false;
          lastSavedText = null;
          dirty = true;
          setSync(localAt === 0 ? '本机草稿优先，正在上传…' : '本机较新，已保护并上传…', 'ok');
          setTimeout(saveRemote, 0);
          return true;
        }
        loading = true;
        text = d.text;
        caret = text.length;
        if (d.meta) applyMeta(d.meta);
        render();
        loading = false;
        setSync('已载入云端 · ' + new Date((d.updatedAt || 0) * 1000).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), 'ok');
        return true;
      }
      setSync(hadMeta ? '已载入云端题目' : '云端无更新', 'ok');
      if (hadMeta) return true;
    }
  } catch (e) {
    setSync('离线（仅本地保存）', 'err');
  }
  return false;
}

let metaCache = { title: '', question: '', annotations: '', target: null };
function getMetaForSave() {
  const q = metaCache.question || ($('qbody').textContent.startsWith('（暂无题目') ? '' : $('qbody').textContent);
  const t = metaCache.title || ($('qtitle').textContent === '未设置' ? '' : $('qtitle').textContent);
  const a = metaCache.annotations || '';
  const out = { title: t, question: q, target: targetCells() };
  if (a) out.annotations = a;
  return out;
}

let lastSavedText = null;
function scheduleSave() {
  if (READONLY || !REMOTE || loading || !booted) return;
  if (text === lastSavedText) return;          // 内容没变就不发请求
  localAt = Date.now();                        // 记下本机编辑时间，供 loadRemote 比较新旧
  localStorage.setItem(LS('local_at'), String(localAt));
  dirty = true;
  setSync('待保存…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveRemote, 3000);    // 3 秒防抖，减少后端压力
}

async function saveRemote() {
  if (READONLY || !REMOTE) return;
  try {
    const ac = new AbortController();
    const to = setTimeout(() => ac.abort(), 8000);
    const r = await fetch('/api/sheet', {
      method: 'POST',
      signal: ac.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: SHEET_ID, text: text, meta: Object.assign(getMetaForSave(), { chars: usedCells(), rows: layoutRows(), target: targetCells() }) }),
    });
    clearTimeout(to);
    const d = await r.json();
    if (d && d.ok) {
      dirty = false;
      lastSavedText = text;
      localAt = 0;                             // 已与云端一致，不再需要「本机较新」保护
      localStorage.setItem(LS('local_at'), '0');
      setSync('已保存 · ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), 'ok');
    } else setSync('保存失败', 'err');
  } catch (e) {
    setSync('保存失败（离线）', 'err');
  }
}

function applyMeta(meta) {
  if (!meta) return;
  if (meta.title) { $('qtitle').textContent = meta.title; metaCache.title = meta.title; document.title = meta.title + ' · 申论答题卡'; }
  if (meta.question) {
    if (meta.annotations) {
      $('qbody').innerHTML = sanitizeHtml(meta.annotations);
      if (flattenMarks($('qbody'))) meta.annotations = $('qbody').innerHTML;  // 压平后回存
    } else $('qbody').textContent = meta.question;
    metaCache.question = meta.question;
    metaCache.annotations = meta.annotations || '';
    $('qbox').open = true;
  }
  // 目标字数：决定格子行数与超字数判定，未处理会导致 250 字的题按默认 350 渲染
  if (meta.target) {
    const sel = $('target'), v = String(meta.target);
    const hit = Array.prototype.some.call(sel.options, (o) => o.value === v);
    if (hit) {
      sel.value = v;
      $('customNum').style.display = 'none';
    } else {
      sel.value = 'custom';
      $('customNum').value = v;
      $('customNum').style.display = '';
    }
    metaCache.target = Number(meta.target);
  }
}

/* ---------------- 材料标注 ---------------- */
function sanitizeHtml(h) {
  const box = document.createElement('div');
  box.innerHTML = String(h || '');
  box.querySelectorAll('script,iframe,object,embed,link,style').forEach(n => n.remove());
  box.querySelectorAll('*').forEach(n => {
    [...n.attributes].forEach(a => {
      if (/^on/i.test(a.name) || (a.name === 'href' && /^javascript:/i.test(a.value))) n.removeAttribute(a.name);
    });
  });
  return box.innerHTML;
}

/** 去掉重复包裹的同色标记：<mark class=g><mark class=g>x</mark></mark> → 单个 */
function flattenMarks(root) {
  let changed = false;
  for (let pass = 0; pass < 5; pass += 1) {
    let hit = false;
    root.querySelectorAll('mark, u.mk, s.mk').forEach((el) => {
      const p = el.parentElement;
      if (p && p !== root && p.tagName === el.tagName && p.className === el.className) {
        el.replaceWith(...el.childNodes);
        hit = true;
      }
    });
    if (hit) changed = true; else break;
  }
  return changed;
}

const markbar = $('markbar');
let savedRange = null;

function inQbody(node) {
  const b = $('qbody');
  return node && (b === node || b.contains(node));
}

function currentRange() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return null;
  const r = sel.getRangeAt(0);
  if (!r.toString().trim()) return null;
  if (!inQbody(r.commonAncestorContainer)) return null;
  return r;
}

function showMarkbar() {
  const r = currentRange();
  if (!r) { markbar.classList.remove('show'); return; }
  savedRange = r.cloneRange();
  const rect = r.getBoundingClientRect();
  markbar.classList.add('show');
  const bw = markbar.offsetWidth || 300;
  let left = rect.left + rect.width / 2 - bw / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - bw - 8));
  let top = rect.top - markbar.offsetHeight - 8;
  if (top < 8) top = rect.bottom + 8;
  markbar.style.left = left + 'px';
  markbar.style.top = top + 'px';
}

document.addEventListener('selectionchange', () => {
  clearTimeout(window.__selT);
  window.__selT = setTimeout(showMarkbar, 120);
});
let scrollLock = 0;
document.addEventListener('scroll', (e) => {
  // 材料面板内部滚动（比如拖到边缘自动滚）不关闭工具条，避免标注时闪掉
  if (e.target && e.target.id === 'qbody') return;
  if (Date.now() < scrollLock) return;
  markbar.classList.remove('show');
}, true);
document.addEventListener('mousedown', (e) => {
  if (!e.target.closest('#markbar')) markbar.classList.remove('show');
});

function applyMark(kind) {
  const r = savedRange || currentRange();
  if (!r) return;
  if (kind === 'clear') {
    // 清除选区内的所有标记
    const frag = r.cloneContents();
    const walker = document.createTreeWalker(frag, NodeFilter.SHOW_ELEMENT);
    const targets = [];
    let n;
    while ((n = walker.nextNode())) {
      if (n.tagName === 'MARK' || (n.tagName === 'U' && n.classList.contains('mk')) || (n.tagName === 'S' && n.classList.contains('mk'))) targets.push(n);
    }
    if (!targets.length) { markbar.classList.remove('show'); return; }
    targets.forEach(el => el.replaceWith(...el.childNodes));
    r.deleteContents();
    r.insertNode(frag);
  } else {
    const el = kind === 'u' ? document.createElement('u')
             : kind === 's' ? document.createElement('s')
             : document.createElement('mark');
    if (kind === 'u' || kind === 's') el.className = 'mk';
    else el.className = kind;
    try {
      const frag = r.extractContents();
      el.appendChild(frag);
      r.insertNode(el);
    } catch (err) { return; }
  }
  // 标注完成即取消选中：选区清空，工具条收起，界面回到干净状态
  try {
    const sel = window.getSelection();
    if (sel) {
      sel.removeAllRanges();
      if (sel.empty) sel.empty();          // 老版 Safari 的兜底
    }
    savedRange = null;                      // 防止下一次误用旧选区
  } catch (err) { /* 清不了也不影响已完成的标记 */ }
  markbar.classList.remove('show');
  metaCache.annotations = $('qbody').innerHTML;
  scheduleSave();
}

markbar.addEventListener('mousedown', (e) => {
  // 不让按钮抢焦点，否则选区在 mousedown 阶段就已经被折叠
  e.preventDefault();
});

markbar.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-mark]');
  if (b) { applyMark(b.dataset.mark); }
});

$('clearMarks').addEventListener('click', () => {
  if (!confirm('清除全部标记？题目文字不会变。')) return;
  const q = metaCache.question || $('qbody').textContent;
  $('qbody').textContent = q;
  metaCache.annotations = '';
  scheduleSave();
});

/* ---------------- 对外接口（供出题/评分程序读写） ---------------- */
window.SheetAPI = {
  id: SHEET_ID,
  getText: () => text,
  setText: (t, opts) => { loading = !(opts && opts.sync); text = String(t || ''); caret = text.length; render(); if (opts && opts.sync) saveRemote(); },
  getCaret: () => caret,
  setCaret: (pos) => { caret = Math.max(0, Math.min(Number(pos) || 0, text.length)); render(); },
  append: (t) => { append(String(t || '')); },
  getStats: () => ({
    text, chars: usedCells(), rows: layoutRows(),
    target: targetCells(), lines: linesOf(text), locked, readonly: READONLY,
  }),
  clear: () => { if (!locked) { text = ''; render(); saveRemote(); } },
  setLock: (v) => { $('lock').checked = !!v; $('lock').dispatchEvent(new Event('change')); },
  setQuestion: (q, title) => { applyMeta({ question: q, title: title || '' }); },
  getMeta: () => ({ title: $('qtitle').textContent, question: $('qbody').textContent }),
  save: () => saveRemote(),
  reload: () => loadRemote(),
};

/* ---------------- 只读模式 ---------------- */
function applyReadonly() {
  if (!READONLY) return;
  $('rotip').classList.add('show');
  sink.setAttribute('readonly', 'readonly');
  $('lock').disabled = true;
  $('clearBtn').disabled = true;
  $('newlineBtn').disabled = true;
  $('indentBtn').disabled = true;
  $('centerBtn').disabled = true;
}

/* ---------------- 启动 ---------------- */
(function boot() {
  // ?reset=1：丢弃本机这份草稿，强制以云端为准。换题串稿时用。
  if (QS.get('reset') === '1') {
    localStorage.removeItem(LS('text'));
    localStorage.removeItem(LS('local_at'));
    localStorage.removeItem(LS('target'));
    text = ''; caret = 0; localAt = 0;
  }
  draftArea.value = localStorage.getItem(DRAFT_KEY()) || '';
  draftCount();
  if (localStorage.getItem(LS('draft_open')) === '1') openDraft();   // 上次开着就还开着

  $('merge').checked = mergeDigits;
  $('cols').value = String(COLS);
  if (localStorage.getItem(LS('target'))) {
    const t = localStorage.getItem(LS('target'));
    $('target').value = t;
    if (t === 'custom') {
      $('customNum').style.display = 'inline-block';
      $('customNum').value = localStorage.getItem(LS('custom')) || 350;
    }
  }
  // URL 预填：?text=<base64 或明文>&title=<标题>
  const b64 = QS.get('text');
  if (b64) {
    try {
      const decoded = decodeURIComponent(escape(atob(b64.replace(/-/g, '+').replace(/_/g, '/'))));
      text = decoded;
    } catch (e) { text = b64; }
  }
  const t = QS.get('title');
  if (t) applyMeta({ title: decodeURIComponent(t) });

  render();
  applyReadonly();
  loadRemote().then((loaded) => {
    booted = true;
    // 老文本里的半角空格都是缩进，一次性转全角（占格），避免切换交互后整体左移。
    // 必须放在云端载入之后，否则会被服务器上的旧文本覆盖。
    if (localStorage.getItem('shenlun_sheet_space_migrated') !== '1') {
      if (/ /.test(text)) {
        text = text.replace(/ /g, '\u3000');
        render();                     // 顺带把迁移结果写回云端
      }
      localStorage.setItem('shenlun_sheet_space_migrated', '1');
    }
    if (!loaded && REMOTE) setTimeout(() => { if ($('qbody').textContent.startsWith('（暂无题目')) loadRemote(); }, 1500);
    if (!loaded) setSync(REMOTE ? '本地草稿' : '本地模式');
    if (!READONLY) focusSink();
  });
})();
</script>
